[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpto-reproduction"
version = "0.1.0"
description = "Python reproduction of Smith and Norato's geometry projection topology optimization method"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC-BY-NC-4.0"}
authors = [
  {name = "Reproduction based on work by Hollis Smith, Julian A. Norato, and Andres Ortegon"},
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
visualization = [
  "Pillow>=10.2",
  "reportlab>=4.2",
  "scikit-image>=0.23",
]

[project.scripts]
gpto = "gpto.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpto = ["data/*.npz", "data/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "slow: full-resolution or optimization regression tests",
]
